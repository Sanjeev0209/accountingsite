```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment Booking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .calendar-box {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        /* Calendar header */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .calendar-header button {
            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background: #007bff;
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        /* Week */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekdays div {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
        }

        /* Calendar days */

        .days div {
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 8px;

            cursor: pointer;
        }

        /* Previous dates */

        .disabled {
            color: #bbb;
            cursor: not-allowed !important;
            background: #f5f5f5;
        }

        /* Available date */

        .available:hover {
            background: #007bff;
            color: white;
        }

        /* Today */

        .today {
            border: 2px solid #007bff;
            font-weight: bold;
        }

        /* Booked */

        .booked {
            background: #ffdddd;
            color: red;
            cursor: not-allowed !important;
        }

        /* Appointment form */

        .appointment-form {
            display: none;

            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .appointment-form h3 {
            margin-top: 0;
        }

        .appointment-form input {
            width: 100%;
            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        .appointment-form button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .appointment-form button:hover {
            background: #0056b3;
        }

        #selectedDate {
            font-weight: bold;
            color: #007bff;
        }

        @media (max-width: 450px) {

            .calendar-box {
                width: 95%;
            }

        }
    </style>
</head>

<body>

    <div class="calendar-box">

        <!-- Calendar -->

        <div class="calendar-header">

            <button onclick="previousMonth()">‹</button>

            <h2 id="monthYear"></h2>

            <button onclick="nextMonth()">›</button>

        </div>


        <div class="weekdays">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>


        <div class="days" id="days"></div>


        <!-- Appointment Form -->

        <div class="appointment-form" id="appointmentForm">

            <h3>Book Appointment</h3>

            <p>
                Selected Date:
                <span id="selectedDate"></span>
            </p>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
            >

            <input
                type="time"
                id="time"
            >

            <button onclick="bookAppointment()">
                Book Appointment
            </button>

        </div>

    </div>


    <script>

        let currentDate = new Date();

        let selectedDate = "";


        function showCalendar() {

            let year = currentDate.getFullYear();
            let month = currentDate.getMonth();

            let monthName = currentDate.toLocaleString(
                "default",
                {
                    month: "long"
                }
            );

            document.getElementById("monthYear").innerText =
                monthName + " " + year;


            let firstDay =
                new Date(year, month, 1).getDay();

            let totalDays =
                new Date(year, month + 1, 0).getDate();


            let days =
                document.getElementById("days");

            days.innerHTML = "";


            // Today

            let today = new Date();

            today.setHours(0, 0, 0, 0);


            // Empty spaces

            for (let i = 0; i < firstDay; i++) {

                let empty = document.createElement("div");

                days.appendChild(empty);

            }


            // Days

            for (let date = 1; date <= totalDays; date++) {

                let day = document.createElement("div");

                day.innerText = date;


                // Create actual date

                let dateObject =
                    new Date(year, month, date);

                dateObject.setHours(0, 0, 0, 0);


                // Date string

                let dateString =
                    year +
                    "-" +
                    String(month + 1).padStart(2, "0") +
                    "-" +
                    String(date).padStart(2, "0");


                // Check booked

                let appointments =
                    JSON.parse(
                        localStorage.getItem("appointments")
                    ) || [];


                let isBooked =
                    appointments.some(
                        appointment =>
                            appointment.date === dateString
                    );


                // Previous date

                if (dateObject < today) {

                    day.classList.add("disabled");

                }


                // Today

                else if (
                    dateObject.getTime() === today.getTime()
                ) {

                    day.classList.add("available");
                    day.classList.add("today");

                    day.onclick = function () {

                        selectDate(dateString);

                    };

                }


                // Booked date

                else if (isBooked) {

                    day.classList.add("booked");

                    day.title = "Already Booked";

                }


                // Future date

                else {

                    day.classList.add("available");

                    day.onclick = function () {

                        selectDate(dateString);

                    };

                }


                days.appendChild(day);

            }

        }


        // Select appointment date

        function selectDate(date) {

            selectedDate = date;

            document.getElementById(
                "selectedDate"
            ).innerText = date;


            document.getElementById(
                "appointmentForm"
            ).style.display = "block";

        }


        // Book appointment

        function bookAppointment() {

            let name =
                document.getElementById("name").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let time =
                document.getElementById("time").value;


            if (name === "" || phone === "" || time === "") {

                alert("Please fill all details.");

                return;

            }


            let appointments =
                JSON.parse(
                    localStorage.getItem("appointments")
                ) || [];


            appointments.push({

                date: selectedDate,

                name: name,

                phone: phone,

                time: time

            });


            localStorage.setItem(
                "appointments",
                JSON.stringify(appointments)
            );


            alert(
                "Appointment booked successfully!"
            );


            // Clear form

            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("time").value = "";


            document.getElementById(
                "appointmentForm"
            ).style.display = "none";


            showCalendar();

        }


        // Previous month

        function previousMonth() {

            let today = new Date();

            today.setDate(1);

            let currentMonth =
                new Date(
                    currentDate.getFullYear(),
                    currentDate.getMonth(),
                    1
                );


            // Do not allow going before current month

            if (currentMonth <= today) {

                currentDate =
                    new Date(
                        today.getFullYear(),
                        today.getMonth(),
                        1
                    );

            }

            else {

                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

            }


            showCalendar();

        }


        // Next month

        function nextMonth() {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            showCalendar();

        }


        // Start calendar

        showCalendar();

    </script>

</body>
</html>
